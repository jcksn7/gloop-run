function leave(){const n=net;net={};G=null;st='menu';try{n.pr&&n.pr.destroy()}catch(e){}try{n.ws&&n.ws.close()}catch(e){}unlock();show('m');hs();msg()}
const RELAYMSG='Не удаётся подключиться к серверу игры. Проверьте интернет, отключите VPN и блокировщики и попробуйте ещё раз',
P2PMSG='Не удалось соединиться напрямую: сеть блокирует P2P. Попробуйте другую сеть (Wi-Fi или мобильный интернет) или используйте сервер игры (server.js)',
newCode=()=>Array.from({length:4},()=>'ABCDEFGHJKLMNPRSTUVXYZ'[Math.random()*22|0]).join(''),
loadPeer=()=>new Promise((ok,no)=>{if(typeof Peer!='undefined')return ok();const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';s.onload=()=>ok();s.onerror=()=>no();document.head.appendChild(s)}),
// виртуальное соединение с тем же интерфейсом, что у PeerJS DataConnection: on / send / close / open
vconn=(snd,cls)=>{const h={};return{open:false,on(e,f){h[e]=f;return this},emit(e,d){h[e]&&h[e](d)},send:snd,close:cls}},
// не даём экрану телефона гаснуть во время игры (иначе у хоста замирает симуляция)
unlock=()=>{if(wl){try{wl.release().catch(()=>{})}catch(e){}wl=null}},
lock=()=>{try{if((st=='game'||st=='over')&&!wl&&navigator.wakeLock)navigator.wakeLock.request('screen').then(l=>{wl=l;l.onrelease=()=>{if(wl===l)wl=null}}).catch(()=>{})}catch(e){}};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)lock()});
function sendAll(d,lossy){if(!net.host)return;if(net.ws){try{net.ws.readyState==1&&net.ws.send(JSON.stringify({to:'*',d,lossy:lossy?1:0}))}catch(e){}}else if(net.ps)net.ps.forEach(q=>{try{q.c&&q.c.send(d)}catch(e){}})}
// хост: общий обработчик входящего соединения (одинаков для ретранслятора и P2P)
function onConn(c){let q;
 c.on('data',d=>{if(!d||typeof d!='object')return;
  if(d.t=='hi'){if(q)return;if(st!='lobby'||net.ps.length>=4)return c.deny();q={n:String(d.n).slice(0,12),hu:(net.h0+net.ps.length*90+rr(-15,15)+360)%360,c};net.ps.push(q);bc()}
  else if(d.t=='in'&&G&&q){const p=G.P[net.ps.indexOf(q)];if(p)p.in={l:d.l?1:0,r:d.r?1:0,j:d.j?1:0}}});
 c.on('close',()=>{const i=net.ps&&q?net.ps.indexOf(q):-1;if(i>0){if(G&&G.P[i])G.P[i].al=0;if(st=='lobby'){net.ps.splice(i,1);bc()}}})}
// гость: общий обработчик сообщений от хоста
function gConn(c,to){c.on('open',()=>{c.was=1;clearTimeout(to);tr=0;c.send({t:'hi',n:nick()})});
 c.on('data',d=>{if(!d||typeof d!='object')return;
  if(d.t=='lob'){net.lb=d.lb;net.me=d.me;net.code=d.code;if(st=='menu'||st=='lobby'){st='lobby';lob()}}
  else if(d.t=='full'){leave();msg('Комната заполнена')}
  else if(d.t=='go')start(d);else if(d.t=='s')snap(d);else if(d.t=='o')over(d.m)})}
// --- ретранслятор WebSocket
function rlRoom(base){const code=newCode(),ws=new WebSocket(base+'/ws?room='+code+'&role=host'),h0=Math.random()*360,V={};let ok=0;
 net={host:1,ws,code,me:0,ps:[{n:nick(),hu:h0,c:null}],h0};
 const out=o=>{try{ws.readyState==1&&ws.send(JSON.stringify(o))}catch(e){}},to=setTimeout(()=>{if(net.ws===ws&&!ok){leave();msg(RELAYMSG)}},45000);
 ws.onmessage=e=>{if(net.ws!==ws)return;let m;try{m=JSON.parse(e.data)}catch(x){return}
  if(m.k=='ready'){ok=1;tr=0;clearTimeout(to);st='lobby';bc()}
  else if(m.k=='err')net.err=m.e;
  else if(m.k=='join'){const id=m.id,drop=d=>{c.open=false;delete V[id];out(d?{kick:id,d}:{kick:id})},c=vconn(d=>out({to:id,d}),()=>drop());c.deny=()=>drop({t:'full'});c.open=true;V[id]=c;onConn(c)}
  else if(m.k=='m'){const c=V[m.id];c&&c.emit('data',m.d)}
  else if(m.k=='leave'){const c=V[m.id];if(c){c.open=false;delete V[m.id];c.emit('close')}}};
 ws.onclose=()=>{clearTimeout(to);if(net.ws!==ws)return;const e=net.err;
  if(e=='taken'){net={rt:1};return startRoom()}
  if(!ok&&e!='busy'&&++tr<6){net={rt:1};msg('Подключаюсь к серверу…');return setTimeout(startRoom,2000)}
  leave();msg(e=='busy'?'Сервер занят, попробуйте позже':ok?'Связь с сервером потеряна':RELAYMSG)};
 ws.onerror=()=>{}}
function rlJoin(base,code){const ws=new WebSocket(base+'/ws?room='+code+'&role=guest'),c=vconn(d=>{try{ws.readyState==1&&ws.send(JSON.stringify(d))}catch(e){}},()=>{try{ws.close()}catch(e){}});
 net={ws,c,code,me:0};
 const to=setTimeout(()=>{if(net.ws===ws&&!c.was){leave();msg(RELAYMSG)}},45000);
 gConn(c,to);
 ws.onmessage=e=>{if(net.ws!==ws)return;let m;try{m=JSON.parse(e.data)}catch(x){return}
  if(m.k=='ready'){c.open=true;c.emit('open')}else if(m.k=='m')c.emit('data',m.d);else if(m.k=='err')net.err=m.e};
 ws.onclose=()=>{clearTimeout(to);if(net.ws!==ws)return;c.open=false;const e=net.err;
  if(!c.was&&!e&&++tr<6){net={rt:1};msg('Подключаюсь к серверу…');return setTimeout(()=>startJoin(code),2000)}
  leave();msg(e=='none'?'Комната не найдена':e=='full'?'Комната заполнена':c.was?'Хост отключился':RELAYMSG)};
 ws.onerror=()=>{}}
// --- запасной вариант: прямое P2P через PeerJS
function p2pRoom(){loadPeer().then(()=>{const code=newCode(),pr=mkPeer('gloop-'+code),h0=Math.random()*360;
  net={host:1,pr,code,me:0,ps:[{n:nick(),hu:h0,c:null}],h0};
  pr.on('open',()=>{if(net.pr===pr){st='lobby';bc()}});
  pr.on('disconnected',()=>{try{pr.reconnect()}catch(x){}});
  pr.on('error',e=>{if(net.pr!==pr)return;net={rt:1};try{pr.destroy()}catch(x){}
   if(e.type=='unavailable-id')return startRoom();
   if(NET.test(e.type)&&++tr<4){msg('Переподключаюсь…');return setTimeout(startRoom,1500)}
   leave();msg(NET.test(e.type)?NETMSG:'Ошибка: '+e.type)});
  pr.on('connection',c=>{c.deny=()=>{c.send({t:'full'});setTimeout(()=>c.close(),400)};onConn(c)})},()=>{net={};msg('PeerJS не загрузился — нужен интернет')})}
function p2pJoin(code){loadPeer().then(()=>{const pr=mkPeer();net={pr,code,me:0};
  const to=setTimeout(()=>{if(net.pr===pr){leave();msg(P2PMSG)}},15000);
  pr.on('error',e=>{if(net.pr!==pr)return;clearTimeout(to);net={rt:1};try{pr.destroy()}catch(x){}
   if(e.type=='peer-unavailable'){leave();return msg('Комната не найдена')}
   if(NET.test(e.type)&&++tr<4){msg('Переподключаюсь…');return setTimeout(()=>startJoin(code),1500)}
   leave();msg(NET.test(e.type)?NETMSG:'Ошибка: '+e.type)});
  pr.on('open',()=>{const c=pr.connect('gloop-'+code,{serialization:'json',reliable:true});net.c=c;gConn(c,to);c.on('error',()=>{});
   c.on('close',()=>{if(net.c!==c)return;const was=c.was;leave();msg(was?'Хост отключился':P2PMSG)})})},()=>{net={};msg('PeerJS не загрузился — нужен интернет')})}
// --- вход в игру
function startRoom(){net={rt:1};relayReady.then(b=>{try{b?rlRoom(b):p2pRoom()}catch(e){net={};msg(RELAYMSG)}})}
function startJoin(code){net={rt:1};relayReady.then(b=>{try{b?rlJoin(b,code):p2pJoin(code)}catch(e){net={};msg(RELAYMSG)}})}
function mkRoom(){if(net.rt||net.pr||net.ws)return;au();msg('Создаю комнату…');startRoom()}
function join(){if(net.rt||net.pr||net.ws)return;au();const code=$('#cdi').value.trim().toUpperCase();if(code.length!=4)return msg('Введите 4-буквенный код');msg('Подключаюсь…');startJoin(code)}
function start(d){G=newG(d.seed,d.ps);ensure(G.L,3000);cam=G.P[0].x-W/S*.42;show(0);st='game';acc=0;lastIn='';sfx('g');lock();upd()}
function startGame(){if(net.ps.length<MIN)return;const d={t:'go',seed:Math.random()*1e9|0,ps:net.ps.map(q=>({n:q.n,hu:q.hu}))};sendAll(d);start(d)}

// ===== управление =====
const KM={KeyA:'l',ArrowLeft:'l',KeyD:'r',ArrowRight:'r',KeyW:'j',ArrowUp:'j',Space:'j'};
function upd(){const i={t:'in',l:+!!(keys.l||tch.l),r:+!!(keys.r||tch.r),j:+!!(keys.j||tch.j)},s=''+i.l+i.r+i.j;if(s==lastIn)return;lastIn=s;
 if(net.host){if(G)G.P[0].in=i}else if(net.c&&net.c.open)net.c.send(i)}
addEventListener('keydown',e=>{au();const k=KM[e.code];if(k&&e.target.tagName!='INPUT'){if(touch){touch=false;$('#tc').style.display='none'}keys[k]=1;e.preventDefault();upd()}});
addEventListener('keyup',e=>{const k=KM[e.code];if(k){keys[k]=0;upd()}});
document.querySelectorAll('#tc b').forEach(b=>{const k=b.dataset.k,f=v=>e=>{e.preventDefault();tch[k]=v;b.classList.toggle('o',!!v);upd()};b.onpointerdown=f(1);b.onpointerup=b.onpointercancel=b.onpointerleave=f(0)});
addEventListener('pointerdown',e=>{au();if(e.pointerType=='touch'&&!touch){touch=true;if(st=='game'||st=='over')$('#tc').style.display='flex'}},{passive:true});$('#tc').oncontextmenu=e=>e.preventDefault();

// ===== старт =====
$('#tt').innerHTML=[...'GLOOP RUN'].map((c,i)=>'<span'+(c=='O'?' class="rb"':'')+' style="animation-delay:'+i*.08+'s">'+(c==' '?'&nbsp;':c)+'</span>').join('');
$('#nk').value=ls('gloopN')||'';$('#nk').onchange=()=>ls('gloopN',$('#nk').value);
$('#ht').onclick=()=>{hO=!hO;ls('gloopO',hO?'1':'0');hs()};$('#so').onclick=e=>{const k=e.target.dataset&&e.target.dataset.s;if(k){hSo=k;hs()}};const sl=(id,k)=>{const e=$(id);e.value=vol[k]*100;e.oninput=()=>{vol[k]=e.value/100;ls('gloopV'+k,vol[k]);setV()};e.onchange=()=>{au();if(k=='s')sfx('b')}};sl('#vm','m');sl('#vs','s');$('#sb').onclick=()=>$('#sp').classList.toggle('o');
$('#mk').onclick=()=>{tr=0;mkRoom()};$('#jn').onclick=()=>{tr=0;join()};$('#go').onclick=startGame;$('#lv').onclick=leave;
$('#cd').onclick=()=>{try{navigator.clipboard.writeText(net.code)}catch(e){}};
hs();show('m');requestAnimationFrame(loop);
</script></body></html>
